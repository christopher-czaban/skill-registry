name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.11.33"
          enable-cache: true
      - name: Synchronize locked dependencies
        run: uv sync --frozen --python "${{ matrix.python-version }}"
      - name: Check public source hygiene
        run: uv run --frozen python scripts/check_public_hygiene.py --root .
      - name: Run full unittest suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run --frozen python -m unittest discover -s tests -v

  package:
    name: Build and inspect package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.11.33"
          enable-cache: true
      - name: Synchronize locked dependencies
        run: uv sync --frozen --python 3.14
      - name: Check public source hygiene
        run: uv run --frozen python scripts/check_public_hygiene.py --root .
      - name: Build wheel and sdist once
        run: uv build --wheel --sdist --out-dir dist
      - name: Inspect wheel and sdist
        run: >-
          uv run --frozen python scripts/check_public_hygiene.py --root .
          --artifact dist/agent_skill_registry-0.1.0-py3-none-any.whl
          --artifact dist/agent_skill_registry-0.1.0.tar.gz
      - name: Run installed-wheel artifact E2E
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          SKILL_REGISTRY_ARTIFACT_DIR: ${{ github.workspace }}/dist
        run: >-
          uv run --frozen python -m unittest discover -s tests
          -p test_package_artifacts.py -v
      - name: Upload inspected distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-skill-registry-distributions
          path: |
            dist/agent_skill_registry-0.1.0-py3-none-any.whl
            dist/agent_skill_registry-0.1.0.tar.gz
          if-no-files-found: error
          retention-days: 14
